name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  checks:
    name: Lint, format and build
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the build can load Better Auth. Not real secrets:
      # the real ones live in Vercel (see First deploy #19).
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Show coverage on the run page
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('## Coverage\n\n| | % |\n|---|---|');for(const k of ['lines','statements','functions','branches'])console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  migrate:
    name: Update the database (staging or live)
    # Only after a merge into develop or main, and only when the checks passed
    if: github.event_name == 'push'
    needs: [checks]
    runs-on: ubuntu-latest
    # develop → the staging database, main → the live database
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Never two at once on the same database
    concurrency: migrate-${{ github.ref_name }}

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Apply new migrations
        run: npx prisma migrate deploy
        env:
          # The direct connection string (no -pooler), saved as a secret in this environment
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
