name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  checks:
    name: Lint, format and build
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
